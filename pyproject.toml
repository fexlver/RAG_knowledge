[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-safety-agentic-rag"
version = "0.3.0"
description = "面向食品安全法规与标准资料的可追溯Agentic RAG系统"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]
